name: Build Debian packages

on:
  push:
    tags:
      - 'v*' # Triggers workflow on tag pushes matching v* (e.g., v0.1.0)
  workflow_dispatch: # Allows manual triggers from the Actions tab
    inputs:
        tag_name:
          description: 'Tag name for the release (e.g., v1.0.0)'
          required: true
          default: '0.56.2b'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:sid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package lists and install build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            devscripts \
            equivs \
            git \
            ca-certificates \
            cmake \
            meson \
            ninja-build \
            pkg-config \
            dh-make

      - name: Build the packages
        run: |
          cd build
          bash build-actions.sh

      - name: Organize build output
        run: |
          mkdir -p output_debs
          # Move generated .deb packages into a single directory for upload
          find . -maxdepth 2 -name "*.deb" -exec mv {} output_debs/ \;

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-hyprland-packages
          path: output_debs/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: debian-hyprland-packages
          path: release_debs

      - name: Create GitHub Release and upload packages
        uses: actions/action-gh-release@v2
        with:
          files: release_debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
